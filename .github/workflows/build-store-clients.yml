name: Build Apphoryn native store clients

on:
  push:
    branches: [main, master]
    paths:
      - 'apps/web/**'
      - 'apps/android/**'
      - 'apps/desktop/**'
      - '.github/workflows/build-store-clients.yml'
  pull_request:
    paths:
      - 'apps/web/**'
      - 'apps/android/**'
      - 'apps/desktop/**'
      - '.github/workflows/build-store-clients.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }} client
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Android
            target: android
            runner: ubuntu-latest
          - name: Windows
            target: windows
            runner: windows-latest
          - name: Linux
            target: linux
            runner: ubuntu-latest
          - name: macOS
            target: macos
            runner: macos-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure Java 17
        if: matrix.target == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK platform and build tools
        if: matrix.target == 'android'
        uses: android-actions/setup-android@v4

      - name: Install Gradle
        if: matrix.target == 'android'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug-signed Android APK
        if: matrix.target == 'android'
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
          gradle -p apps/android --no-daemon assembleDebug
          APK="apps/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          mkdir -p client-artifacts
          cp "$APK" client-artifacts/Apphoryn-Android-debug.apk

      - name: Configure Node.js
        if: matrix.target != 'android'
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install desktop dependencies and run packaging unit tests
        if: matrix.target != 'android'
        working-directory: apps/desktop
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm test

      - name: Package Windows installer
        if: matrix.target == 'windows'
        working-directory: apps/desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npx electron-builder --win nsis --x64
          New-Item -ItemType Directory -Force -Path client-artifacts | Out-Null
          $installers = Get-ChildItem -Path dist -File -Filter '*.exe'
          if (-not $installers) { throw 'electron-builder completed but no Windows .exe installer was found in dist.' }
          $installers | Copy-Item -Destination client-artifacts
          $copied = Get-ChildItem -Path client-artifacts -File -Filter '*.exe'
          if (-not $copied) { throw 'Windows installer copy failed.' }
          $copied | ForEach-Object { Write-Host "Prepared installer: $($_.FullName) ($($_.Length) bytes)" }

      - name: Package Linux AppImage and DEB
        if: matrix.target == 'linux'
        working-directory: apps/desktop
        shell: bash
        run: |
          set -euo pipefail
          npx electron-builder --linux AppImage deb --x64
          mkdir -p client-artifacts
          find dist -maxdepth 1 -type f \( -iname '*.AppImage' -o -iname '*.deb' \) -exec cp {} client-artifacts/ \;
          test -n "$(find client-artifacts -type f -print -quit)"

      - name: Package macOS universal DMG
        if: matrix.target == 'macos'
        working-directory: apps/desktop
        shell: bash
        run: |
          set -euo pipefail
          npx electron-builder --mac dmg --universal
          mkdir -p client-artifacts
          find dist -maxdepth 1 -type f -iname '*.dmg' -exec cp {} client-artifacts/ \;
          test -n "$(find client-artifacts -type f -iname '*.dmg' -print -quit)"

      - name: Upload verified client build outputs
        uses: actions/upload-artifact@v4
        with:
          name: apphoryn-${{ matrix.target }}-client
          path: |
            client-artifacts/*
            apps/desktop/client-artifacts/*
          if-no-files-found: error
          retention-days: 14

  publish-development-release:
    name: Publish development client installers
    needs: build
    if: github.event_name != 'pull_request' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all native client installers
        uses: actions/download-artifact@v4
        with:
          pattern: apphoryn-*-client
          path: client-artifacts
          merge-multiple: true

      - name: Publish rolling Apphoryn development release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apphoryn-store-clients-dev
          name: Apphoryn Native Store Clients — Development Builds
          prerelease: true
          make_latest: false
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            client-artifacts/*
          body: |
            Development builds of the Apphoryn store clients.

            Android: debug-key signed development APK. Not a production/Play Store signing identity.
            Windows and macOS: unsigned installers unless native signing certificates are configured.
            Linux: AppImage and DEB development packages.

            These packages contain the Apphoryn storefront client. They do not bundle third-party application binaries; those are published separately only after release-file verification.
