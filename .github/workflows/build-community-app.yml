name: Build and publish community software

on:
  workflow_dispatch:
    inputs:
      repository_url:
        description: Public GitHub repository already recorded in the Apphoryn catalog
        required: true
        type: string
      git_ref:
        description: Exact branch, tag or commit to build
        required: true
        type: string
      targets:
        description: Comma-separated targets (android,windows,linux,macos)
        required: true
        default: android,windows,linux,macos
        type: string
      app_id:
        description: Stable Apphoryn application identifier
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  build:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - target: android
            runner: ubuntu-latest
          - target: windows
            runner: windows-latest
          - target: linux
            runner: ubuntu-latest
          - target: macos
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 350
    steps:
      - name: Checkout trusted Apphoryn build adapters only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Set up Java for Android
        if: matrix.target == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK for Android target
        if: matrix.target == 'android'
        shell: bash
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -perm -111 2>/dev/null | sort -V | tail -n 1)"
          fi
          if [ -z "$SDKMANAGER" ]; then echo "Android sdkmanager not found." >&2; exit 1; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || "$SDKMANAGER" --licenses </dev/null
          "$SDKMANAGER" --install "platform-tools" "build-tools;35.0.0"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"
      - name: Build untrusted source without Apphoryn secrets
        shell: bash
        if: contains(format(',{0},', inputs.targets), format(',{0},', matrix.target))
        env:
          REPOSITORY_URL: ${{ inputs.repository_url }}
          GIT_REF: ${{ inputs.git_ref }}
          TARGET: ${{ matrix.target }}
        env:
          APPHORYN_AI_SERVICE_URL: 'https://apphoryn-production.up.railway.app'
        run: >-
          python scripts/build_with_recovery.py
          --repository "$REPOSITORY_URL"
          --ref "$GIT_REF"
          --target "$TARGET"
          --output "artifacts/${{ matrix.target }}"
          --report "artifacts/${{ matrix.target }}/build-recovery-report.json"
          --max-retries 1
      - name: Upload platform build output
        if: always() && contains(format(',{0},', inputs.targets), format(',{0},', matrix.target))
        uses: actions/upload-artifact@v4
        with:
          name: apphoryn-build-${{ matrix.target }}-${{ inputs.app_id }}
          path: artifacts/${{ matrix.target }}/
          if-no-files-found: warn
          retention-days: 7

  publish:
    needs: build
    concurrency:
      group: apphoryn-catalog-writes
      cancel-in-progress: false
    if: always() && needs.build.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout trusted Apphoryn publisher only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK for publisher verification
        if: contains(format(',{0},', inputs.targets), ',android,')
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools build-tools;35.0.0
      - name: Download available build outputs as data
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: apphoryn-build-*
          path: artifacts
      - name: Verify again and publish to Apphoryn Releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          APPHORYN_GITHUB_REF: ${{ github.ref_name }}
          REPOSITORY_URL: ${{ inputs.repository_url }}
          GIT_REF: ${{ inputs.git_ref }}
          # These secrets are available only after source builds finish, in the trusted publisher.
          APPHORYN_ANDROID_KEYSTORE_BASE64: ${{ secrets.APPHORYN_ANDROID_KEYSTORE_BASE64 }}
          APPHORYN_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.APPHORYN_ANDROID_KEYSTORE_PASSWORD }}
          APPHORYN_ANDROID_KEY_ALIAS: ${{ secrets.APPHORYN_ANDROID_KEY_ALIAS }}
          APPHORYN_ANDROID_KEY_PASSWORD: ${{ secrets.APPHORYN_ANDROID_KEY_PASSWORD }}
        run: python scripts/publish_github_release.py --directory artifacts --repository "$REPOSITORY_URL" --ref "$GIT_REF"
