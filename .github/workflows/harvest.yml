name: Apphoryn Scout — import real software releases

on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'apps/web/catalog/index.json'
      - 'data/scout-state.json'
      - 'data/scout-retry.json'
      - '.github/workflows/global-scout.yml'
      - '.github/workflows/harvest.yml'
      - 'app/github_release_mirror.py'
      - 'scripts/global_scout.py'
      - 'tests/test_global_scout.py'
      - 'tests/test_github_release_mirror.py'
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      query:
        description: GitHub repository search query
        required: true
        default: 'topic:opensource'
      limit:
        description: Maximum search results per discovery query (1-10), plus the seed catalogue
        required: true
        default: '6'
      skip_seeds:
        description: Skip the maintained seed repositories
        required: false
        default: false
        type: boolean

concurrency:
  group: apphoryn-catalog-writes
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Apphoryn trusted automation
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Java for Android package signature checks
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK build-tools for APK verification
        shell: bash
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -perm -111 2>/dev/null | sort -V | tail -n 1)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "Android sdkmanager was not found on this runner." >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || "$SDKMANAGER" --licenses </dev/null
          "$SDKMANAGER" --install "platform-tools" "build-tools;35.0.0"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"
      - name: Discover, verify, import and mirror actual release files
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          APPHORYN_GITHUB_REF: ${{ github.ref_name }}
          APPHORYN_QUERY: ${{ inputs.query || 'topic:opensource' }}
          APPHORYN_LIMIT: ${{ inputs.limit || '6' }}
          APPHORYN_AUTO_BUILD_TARGETS: ${{ vars.APPHORYN_AUTO_BUILD_TARGETS || 'android,windows,linux,macos' }}
          APPHORYN_DISCOVERY_QUERIES: |
            topic:android-app
            topic:desktop-app
            topic:linux-app
            topic:windows-app
            topic:macos-app
            topic:opensource
            topic:command-line-tool
            topic:productivity-app
            topic:utility-app
            topic:open-source-app
          APPHORYN_MAX_DISCOVERY_PER_RUN: ${{ vars.APPHORYN_MAX_DISCOVERY_PER_RUN || '60' }}
          APPHORYN_MAX_AUTO_BUILDS_PER_RUN: ${{ vars.APPHORYN_MAX_AUTO_BUILDS_PER_RUN || '3' }}
          APPHORYN_AI_PROVIDER_PRIORITY: ${{ vars.APPHORYN_AI_PROVIDER_PRIORITY || 'gemini,groq,xai,openrouter,cloudflare,comet' }}
          APPHORYN_AI_API_KEY: ${{ secrets.APPHORYN_AI_API_KEY }}
          APPHORYN_AI_MODEL: ${{ vars.APPHORYN_AI_MODEL }}
          # Provider credentials are exposed only to the trusted Scout job, never to source-build jobs.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          COMET_API_KEY: ${{ secrets.COMET_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          APPHORYN_AI_FREE_ONLY: ${{ vars.APPHORYN_AI_FREE_ONLY || 'true' }}
          APPHORYN_AI_ALLOW_PAID_REQUESTS: ${{ vars.APPHORYN_AI_ALLOW_PAID_REQUESTS || 'false' }}
          APPHORYN_AI_ENABLE_XAI: ${{ vars.APPHORYN_AI_ENABLE_XAI || 'false' }}
          APPHORYN_AI_ALLOW_LEGACY_PROVIDER: ${{ vars.APPHORYN_AI_ALLOW_LEGACY_PROVIDER || 'false' }}
          APPHORYN_AI_CONFIRM_GEMINI_GROQ_FREE_TIER: ${{ vars.APPHORYN_AI_CONFIRM_GEMINI_GROQ_FREE_TIER || 'false' }}
          APPHORYN_AI_ALLOW_CREDIT_BASED_PROVIDERS: ${{ vars.APPHORYN_AI_ALLOW_CREDIT_BASED_PROVIDERS || 'false' }}
          APPHORYN_COMET_FREE_MODEL_IDS: ${{ vars.APPHORYN_COMET_FREE_MODEL_IDS || '' }}
          APPHORYN_AI_ENABLE_CLOUDFLARE: ${{ vars.APPHORYN_AI_ENABLE_CLOUDFLARE || 'false' }}
          SKIP_SEEDS: ${{ inputs.skip_seeds || 'false' }}
        run: |
          if [ "$SKIP_SEEDS" = "true" ]; then
            python scripts/harvest_and_import.py --query "$APPHORYN_QUERY" --limit "$APPHORYN_LIMIT" --skip-seeds
          else
            python scripts/harvest_and_import.py --query "$APPHORYN_QUERY" --limit "$APPHORYN_LIMIT"
          fi
      - name: Save discovery and mirror report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apphoryn-scout-report
          path: |
            discovery-candidates.json
            harvest-results.json
          if-no-files-found: warn
          retention-days: 30
