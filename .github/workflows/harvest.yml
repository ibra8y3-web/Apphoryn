name: Apphoryn Scout — global repository crawl and migration

on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'apps/web/catalog/index.json'
      - 'data/scout-state.json'
      - 'data/scout-retry.json'
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
    inputs:
      max_repositories:
        description: Maximum repositories read from GitHub's public repository listing (whole 100-item pages are consumed)
        required: true
        default: '200'
      max_pages:
        description: GitHub public listing pages for this run (1–100)
        required: true
        default: '25'
      skip_seeds:
        description: Skip maintained initial repository sources
        required: false
        default: false
        type: boolean

concurrency:
  group: apphoryn-catalog-writes
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout Apphoryn trusted automation
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Java for Android package signature checks
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK build-tools for APK verification
        shell: bash
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -perm -111 2>/dev/null | sort -V | tail -n 1)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "Android sdkmanager was not found on this runner." >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || "$SDKMANAGER" --licenses </dev/null
          "$SDKMANAGER" --install "platform-tools" "build-tools;35.0.0"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Discover public repositories, apply license gates, import and mirror real packages
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          APPHORYN_GITHUB_REF: ${{ github.ref_name }}
          APPHORYN_AUTO_BUILD_TARGETS: ${{ vars.APPHORYN_AUTO_BUILD_TARGETS || 'off' }}
          APPHORYN_AI_API_KEY: ${{ secrets.APPHORYN_AI_API_KEY }}
          APPHORYN_AI_MODEL: ${{ vars.APPHORYN_AI_MODEL }}
          MAX_REPOSITORIES: ${{ inputs.max_repositories || '200' }}
          MAX_PAGES: ${{ inputs.max_pages || '25' }}
          SKIP_SEEDS: ${{ inputs.skip_seeds || 'false' }}
        shell: bash
        run: |
          if [ "$SKIP_SEEDS" = "true" ]; then
            python scripts/harvest_and_import.py --global-scan --max-repositories "$MAX_REPOSITORIES" --max-pages "$MAX_PAGES" --skip-seeds
          else
            python scripts/harvest_and_import.py --global-scan --max-repositories "$MAX_REPOSITORIES" --max-pages "$MAX_PAGES"
          fi

      - name: Persist the global Scout cursor and retry queue
        if: always() && hashFiles('data/scout-state.json') != ''
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp data/scout-state.json "$RUNNER_TEMP/scout-state.json"
          if [ -f data/scout-retry.json ]; then cp data/scout-retry.json "$RUNNER_TEMP/scout-retry.json"; fi
          for attempt in 1 2 3; do
            git fetch origin "$TARGET_BRANCH"
            git reset --hard FETCH_HEAD
            mkdir -p data
            cp "$RUNNER_TEMP/scout-state.json" data/scout-state.json
            if [ -f "$RUNNER_TEMP/scout-retry.json" ]; then cp "$RUNNER_TEMP/scout-retry.json" data/scout-retry.json; fi
            git add data/scout-state.json
            if [ -f data/scout-retry.json ]; then git add data/scout-retry.json; fi
            if git diff --cached --quiet; then
              echo "Scout checkpoint did not change."
              exit 0
            fi
            git commit -m "Advance Apphoryn Scout migration checkpoint"
            if git push origin "HEAD:$TARGET_BRANCH"; then exit 0; fi
            echo "Checkpoint push raced with another commit; refreshing branch and retrying ($attempt/3)."
          done
          echo "Could not persist Scout checkpoint after three attempts." >&2
          exit 1

      - name: Save discovery, migration and crawl reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apphoryn-global-scout-report
          path: |
            discovery-candidates.json
            harvest-results.json
            scout-report.json
          if-no-files-found: warn
          retention-days: 30
