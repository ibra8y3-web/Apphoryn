name: Apphoryn Scout — scheduled discovery and import
on:
  schedule:
    - cron: '23 */8 * * *'
  workflow_dispatch:
    inputs:
      query:
        description: GitHub repository search query
        required: true
        default: 'topic:opensource stars:>100'
      limit:
        description: Maximum candidates (1-10)
        required: true
        default: '5'
permissions:
  contents: read
jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Discover candidates and optionally import approved licenses
        env:
          APPHORYN_GITHUB_TOKEN: ${{ github.token }}
          APPHORYN_QUERY: ${{ inputs.query || 'topic:opensource stars:>100' }}
          APPHORYN_LIMIT: ${{ inputs.limit || '5' }}
          APPHORYN_API_BASE_URL: ${{ secrets.APPHORYN_API_BASE_URL }}
          APPHORYN_ADMIN_TOKEN: ${{ secrets.APPHORYN_ADMIN_TOKEN }}
          APPHORYN_AUTO_BUILD_TARGETS: ${{ vars.APPHORYN_AUTO_BUILD_TARGETS }}
        run: python scripts/harvest_and_import.py --query "$APPHORYN_QUERY" --limit "$APPHORYN_LIMIT"
      - uses: actions/upload-artifact@v4
        with:
          name: apphoryn-scout-report
          path: |
            discovery-candidates.json
            harvest-results.json
          if-no-files-found: error
          retention-days: 30
