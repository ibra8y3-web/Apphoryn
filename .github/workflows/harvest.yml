name: Apphoryn Scout — import real software releases

# The continuous Global Scout workflow owns recurring imports. This workflow
# is kept for an administrator-requested, one-off discovery/import run only.
on:
  workflow_dispatch:
    inputs:
      query:
        description: GitHub repository search query
        required: true
        default: 'topic:opensource'
      limit:
        description: GitHub search page size; results are paginated through the available result set
        required: true
        default: '100'
      skip_seeds:
        description: Skip the maintained seed repositories
        required: false
        default: false
        type: boolean

concurrency:
  group: apphoryn-catalog-writes
  cancel-in-progress: false

permissions:
  contents: write
  actions: write
  id-token: write

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Apphoryn trusted automation
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Java for Android package signature checks
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK build-tools for APK verification
        shell: bash
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -perm -111 2>/dev/null | sort -V | tail -n 1)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "Android sdkmanager was not found on this runner." >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || "$SDKMANAGER" --licenses </dev/null
          "$SDKMANAGER" --install "platform-tools" "build-tools;35.0.0"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"
      - name: Discover, verify, import and mirror actual release files
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          APPHORYN_GITHUB_REF: ${{ github.ref_name }}
          APPHORYN_AI_SERVICE_URL: 'https://apphoryn-production.up.railway.app'
          APPHORYN_IMPORT_INTERVAL_SECONDS: '60'
          APPHORYN_QUERY: ${{ inputs.query || 'topic:opensource' }}
          APPHORYN_LIMIT: ${{ inputs.limit || '100' }}
          APPHORYN_AUTO_BUILD_TARGETS: ${{ vars.APPHORYN_AUTO_BUILD_TARGETS || 'android,windows,linux,macos' }}
          APPHORYN_DISCOVERY_QUERIES: |
            topic:android-app
            topic:desktop-app
            topic:linux-app
            topic:windows-app
            topic:macos-app
            topic:opensource
            topic:command-line-tool
            topic:productivity-app
            topic:utility-app
            topic:open-source-app
          SKIP_SEEDS: ${{ inputs.skip_seeds || 'false' }}
        run: |
          if [ "$SKIP_SEEDS" = "true" ]; then
            python scripts/harvest_and_import.py --query "$APPHORYN_QUERY" --limit "$APPHORYN_LIMIT" --import-interval-seconds "$APPHORYN_IMPORT_INTERVAL_SECONDS" --skip-seeds
          else
            python scripts/harvest_and_import.py --query "$APPHORYN_QUERY" --limit "$APPHORYN_LIMIT" --import-interval-seconds "$APPHORYN_IMPORT_INTERVAL_SECONDS"
          fi
      - name: Save discovery and mirror report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apphoryn-scout-report
          path: |
            discovery-candidates.json
            harvest-results.json
          if-no-files-found: warn
          retention-days: 30
