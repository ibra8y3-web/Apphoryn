[project]
name = "apphoryn"
version = "0.1.0"
description = "Open-source software discovery, build and distribution platform"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Apphoryn Community"}]
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic>=2.8,<3"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
