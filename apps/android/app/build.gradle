plugins {
    id "com.android.application"
}

android {
    namespace "com.apphoryn.store"
    compileSdk 35

    defaultConfig {
        applicationId "com.apphoryn.store"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "0.3.0"
    }

    sourceSets {
        main {
            // Package the exact same verified storefront files used by the PWA.
            assets.srcDirs += file("../../web")
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            applicationIdSuffix ".dev"
            versionNameSuffix "-dev"
        }
        release {
            minifyEnabled false
        }
    }
}
