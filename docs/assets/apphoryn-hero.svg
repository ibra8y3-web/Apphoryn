    <text x="1163" y="302" text-anchor="middle" fill="#9cd4d1" font-size="9">Verified packages</text>

    <rect x="918" y="333" width="201" height="106" rx="20" fill="#182b48" stroke="#7b9fff" stroke-opacity=".65" stroke-width="2"/>
    <circle cx="956" cy="371" r="19" fill="#334d91"/>
    <path d="M947 371h18M956 362v18M949 364l-2 7 2 7M963 364l2 7-2 7" stroke="#dce8ff" stroke-width="2" fill="none" stroke-linecap="round"/>
    <text x="986" y="369" fill="#f0f5ff" font-size="15" font-weight="700">NIEBEX</text>
    <text x="986" y="389" fill="#a9bddf" font-size="11">AI coordination layer</text>
    <rect x="940" y="411" width="155" height="15" rx="7.5" fill="#2c4267"/>
