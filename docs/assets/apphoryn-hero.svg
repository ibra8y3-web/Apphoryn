<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="512" viewBox="0 0 1280 512" role="img" aria-labelledby="title desc">
  <title id="title">Apphoryn — Open software. Built together.</title>
  <desc id="desc">A dark blue technology illustration representing open-source software discovery, verification, and distribution.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset=".55" stop-color="#101f3b"/>
      <stop offset="1" stop-color="#142b4c"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#69dcff"/>
      <stop offset="1" stop-color="#5277ff"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ad86ff"/>
      <stop offset="1" stop-color="#5a79ff"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#477dff" stop-opacity=".34"/>
      <stop offset="1" stop-color="#477dff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#8fb8ff" stroke-opacity=".075" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#020817" flood-opacity=".5"/>
    </filter>
  </defs>
  <rect width="1280" height="512" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="512" rx="28" fill="url(#grid)"/>
  <circle cx="1010" cy="230" r="340" fill="url(#glow)"/>
  <circle cx="1180" cy="35" r="170" fill="#6b7eff" opacity=".08"/>
  <path d="M0 420C240 350 365 535 640 450S1030 330 1280 415V512H0Z" fill="#0b1730" opacity=".55"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="82" y="190" fill="#f4f8ff" font-size="68" font-weight="800" letter-spacing="3">APPHORYN</text>
    <rect x="84" y="220" width="72" height="5" rx="2.5" fill="url(#blue)"/>
    <text x="82" y="278" fill="#d8e6ff" font-size="30" font-weight="600">Open software. Built together.</text>
    <text x="84" y="326" fill="#9fb4d5" font-size="19">Discover real apps. Verify real packages. Share with confidence.</text>
    <g transform="translate(84 378)">
      <rect width="355" height="48" rx="24" fill="#ffffff" fill-opacity=".07" stroke="#8abaff" stroke-opacity=".35"/>
      <circle cx="24" cy="24" r="5" fill="#75d6ff"/>
      <text x="43" y="31" font-size="15" font-weight="700" letter-spacing="2.2" fill="#cfe3ff">DISCOVER  •  VERIFY  •  DISTRIBUTE</text>
    </g>
  </g>
  <g filter="url(#shadow)">
    <path d="M770 157C832 157 851 117 909 117" fill="none" stroke="#71cfff" stroke-opacity=".65" stroke-width="3" stroke-dasharray="7 9"/>
    <path d="M770 338C831 338 852 385 914 385" fill="none" stroke="#9b8cff" stroke-opacity=".65" stroke-width="3" stroke-dasharray="7 9"/>
    <path d="M1020 248H1103" fill="none" stroke="#8ebaff" stroke-opacity=".7" stroke-width="3"/>
    <rect x="778" y="171" width="180" height="136" rx="22" fill="#142945" stroke="#6fbfff" stroke-opacity=".7" stroke-width="2"/>
