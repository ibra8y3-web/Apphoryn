    <text x="821" y="282" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#d5eaff" font-size="10" font-weight="700" letter-spacing="1.2">SOURCE VERIFIED</text>

    <rect x="936" y="82" width="172" height="125" rx="20" fill="#172945" stroke="#9c8aff" stroke-opacity=".75" stroke-width="2"/>
    <rect x="953" y="99" width="48" height="48" rx="13" fill="url(#violet)"/>
    <path d="M977 109l13 5v10c0 9-6 15-13 19-7-4-13-10-13-19v-10z" fill="none" stroke="#fff" stroke-width="2.4"/>
    <path d="M970 124l5 5 10-11" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1011" y="119" fill="#f4f1ff" font-size="15" font-weight="700">VERIFY</text>
    <text x="1011" y="141" fill="#b6aedf" font-size="11">Hash · format · license</text>
    <path d="M956 172h130" stroke="#8d82c8" stroke-opacity=".45" stroke-width="1"/>
    <circle cx="964" cy="188" r="4" fill="#9d8bff"/>
    <text x="976" y="192" fill="#d9d2ff" font-size="10">Artifact checks</text>

    <rect x="1100" y="190" width="126" height="122" rx="20" fill="#17334b" stroke="#6fd9ce" stroke-opacity=".8" stroke-width="2"/>
    <rect x="1135" y="208" width="56" height="56" rx="15" fill="#205d67"/>
    <path d="M1147 236h32M1163 220v32M1151 228l-4 8 4 8M1175 228l4 8-4 8" stroke="#b6fff1" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
